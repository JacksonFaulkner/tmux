# Prefix: Ctrl+b (default)
set -g prefix C-b

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Switch windows with Ctrl+b Ctrl+h/l
bind C-h previous-window
bind C-l next-window

# C-b g → Cmd+` (cycle Ghostty windows across monitors)
bind g run-shell "osascript -e 'tell application \"System Events\" to key code 50 using command down'"

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window keeps current path
bind c new-window -c "#{pane_current_path}"

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1

# Automatic rename off — nvim pushes custom window titles directly
set -g automatic-rename off

# Mouse support
set -g mouse on

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Critical: zero delay on Esc (default 500ms destroys nvim experience)
set -sg escape-time 0

# Let nvim detect focus changes (autoread, gitgutter, etc.)
set -g focus-events on

# Scrollback history (default 2000 is cooked)
set -g history-limit 50000

# Message style (Dracula blue)
set -g message-style "bg=#8be9fd,fg=#282a36"

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# Keybind help popup
bind -n M-? display-popup -w 55 -h 28 -E "~/.config/tmux/keybinds.sh"

# Status bar off (ctrl+b w via sessionx replaces it)
set -g status off

# SessionX (fuzzy session picker — replaces ctrl+b w)
set -g @sessionx-bind 'w'
set -g @sessionx-window-mode 'on'
set -g @sessionx-tree-mode 'off'
set -g @sessionx-preview-location 'right'
set -g @sessionx-preview-ratio '50%'
set -g @sessionx-window-width '85%'
set -g @sessionx-window-height '85%'
set -g @sessionx-layout 'default'
set -g @sessionx-prompt '> '
set -g @sessionx-pointer '▶'
set -g @sessionx-additional-options "--color bg:#282a36,bg+:#44475a,fg:#f8f8f2,fg+:#f8f8f2,hl:#bd93f9,hl+:#ff79c6,info:#6272a4,prompt:#8be9fd,pointer:#ff79c6,marker:#50fa7b,spinner:#bd93f9,header:#6272a4,border:#6272a4,label:#f8f8f2,preview-border:#6272a4,preview-label:#f8f8f2,list-border:#6272a4,list-label:#f8f8f2,input-border:#6272a4,input-label:#f8f8f2 --border none --list-border rounded --list-label ' Sessions ' --input-border rounded --input-label ' Search ' --preview-border rounded --preview-label ' Preview ' --header-border none --no-separator"
run-shell ~/.config/tmux/plugins/plain/sessionx.tmux
